[package]
name = "solana-level-1-token-starter"
version = "0.1.0"
description = "Modern Token-2022-compatible Anchor starter for Superteam KZ Level 1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_level_1_token_starter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["associated_token", "token_2022"] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-keypair = "=3.1.2"
solana-message = "=3.0.1"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
